; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Configure ADC mode and LCD geometry through ESP-IDF menuconfig:
;     pio run -e esp32dev -t menuconfig
; Then build/upload the same environment:
;     pio run -e esp32dev
;     pio run -e esp32dev -t upload
;
; The menuconfig defaults are Continuous/DMA ADC and 20x4 LCD.

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
framework = espidf
upload_port = COM6
monitor_port = COM6
upload_speed = 115200
monitor_speed = 115200
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_filters = esp32_exception_decoder
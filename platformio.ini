; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Configure ADC mode and LCD geometry through ESP-IDF menuconfig:
;     pio run -e esp32dev -t menuconfig
; Then build/upload the same environment:
;     pio run -e esp32dev
;     pio run -e esp32dev -t upload
;
; The menuconfig defaults are Continuous/DMA ADC and 20x4 LCD.

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
framework = espidf
upload_port = COM6
monitor_port = COM6
upload_speed = 921600
monitor_speed = 921600

; TEST ONLY: exposes a simulated physical-feedback input so the mobile power
; controls can be exercised before a real feedback GPIO is installed. It does
; not bypass PIN authentication or any live inverter interlock/state-machine
; checks. Never flash this profile as a production safety build.
[env:esp32dev-ui-mock]
extends = env:esp32dev
build_flags = -DINVERTER_ENABLE_MOCK_PHYSICAL_FEEDBACK=1

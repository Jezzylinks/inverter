; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
framework = espidf
upload_port = COM6
monitor_port = COM6
upload_speed = 921600
monitor_speed = 921600
; One shared firmware supports both physical LCD geometries.
; Edit include/lcd/menu_config.h before compiling: 0 = 16×2, 1 = 20×4.

; TEST ONLY: exposes a simulated physical-feedback input so the mobile power
; controls can be exercised before a real feedback GPIO is installed. It does
; not bypass PIN authentication or any live inverter interlock/state-machine
; checks. Never flash this profile as a production safety build.
[env:esp32dev-ui-mock]
extends = env:esp32dev
build_flags = -DINVERTER_ENABLE_MOCK_PHYSICAL_FEEDBACK=1
